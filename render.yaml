# Render deployment — public URL for judges.
# The web service runs the UI server (dashboard + graph + SSE) and hosts the
# orchestrator in-process; the target agent runs as a private service the
# orchestrator attacks over the internal network.

services:
  - type: web
    name: earlycore
    runtime: node
    plan: free
    buildCommand: npm ci && cd ui/web && npm ci && npm run build
    startCommand: npx tsx ui/server.ts
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: EARLYCORE_FAST
        value: '0'
      # Private services resolve by name on Render's internal network.
      - key: AGENT_URL
        value: http://earlycore-target:10000
      # Sponsor keys are set in the Render dashboard, never committed:
      # OPENAI_API_KEY, COMPOSIO_API_KEY, LANGFUSE_*, CLICKHOUSE_URL, SENSO_API_KEY, PIONEER_*

  - type: pserv
    name: earlycore-target
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npx tsx demo/vulnerable-agent.ts
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: PORT_AGENT
        value: '10000'
