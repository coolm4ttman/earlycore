# Render deployment — public URL for judges (earlycore.io).
# Deploy: Render dashboard → New → Blueprint → select this repo. The sync:false
# env vars below prompt for your keys during creation; everything else is
# automatic. The target agent runs as a private service the platform attacks
# over the internal network.

services:
  - type: web
    name: earlycore
    runtime: node
    plan: starter
    buildCommand: npm ci && cd ui/web && npm ci --legacy-peer-deps && npm run build
    startCommand: npx tsx ui/server.ts
    healthCheckPath: /api/topology
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: EARLYCORE_FAST
        value: '1'
      # Private services resolve by name on Render's internal network.
      - key: AGENT_URL
        value: http://earlycore-target:10000
      # Drive the loop from the committed real red-team results (84 findings).
      - key: EARLYCORE_MODE
        value: promptfoo
      - key: EARLYCORE_RESULTS_FILE
        value: .earlycore/redteam-results.json
      - key: THESYS_MODEL
        value: c1/anthropic/claude-sonnet-4.6/v-20260331
      # Secrets — prompted at blueprint creation, never committed.
      - key: OPENAI_API_KEY
        sync: false
      - key: THESYS_API_KEY
        sync: false
      - key: SENSO_API_KEY
        sync: false
      - key: COMPOSIO_API_KEY
        sync: false

  - type: pserv
    name: earlycore-target
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npx tsx demo/vulnerable-agent.ts
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: PORT_AGENT
        value: '10000'
